services:
  - type: web
    name: academic-notes-engine
    runtime: docker
    dockerfilePath: services/notes-engine/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NOTES_ENGINE_TOKEN
        sync: false

  - type: worker
    name: academic-notes-engine-worker
    runtime: docker
    dockerfilePath: services/notes-engine/Dockerfile
    dockerCommand: python -m app.worker
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NOTES_ENGINE_TOKEN
        sync: false
